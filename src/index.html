<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Hatef Khodkar – Senior Angular Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hatef Khodkar is a Senior Angular Developer in Dubai with 7+ years building fast, reliable web apps, dashboards and admin panels. Available for freelance projects.">
  <meta name="theme-color" content="#060914">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var root = document.documentElement;
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) {}
      root.setAttribute('data-theme', theme);
      root.classList.add('js');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

</body>
</html>
